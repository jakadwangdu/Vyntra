name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env Configuration
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            cp .env.example .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          # Locate built APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release_assets/Vyntra.apk
            echo "APK prepared at release_assets/Vyntra.apk"
          else
            echo "Error: APK not found!" && exit 1
          fi

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Vyntra ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/Vyntra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
