name: Build, Release & Publish Vyntra APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish to GitHub Releases'
        type: boolean
        required: false
        default: true
      publish_package:
        description: 'Publish to GitHub Packages (GHCR)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-publish:
    name: Build APK, Publish Release & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Repository & Locate Gradle Project
        id: locate-project
        run: |
          echo "================ Repository Contents ================"
          ls -la
          echo "====================================================="
          
          # Locate settings.gradle.kts or settings.gradle in root or any subfolder
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error title=Missing Project Files::No settings.gradle.kts found in the repository!"
            echo ""
            echo "❌ WHY THIS FAILED:"
            echo "The repository on GitHub currently does not contain the Android project source code."
            echo "Gradle requires settings.gradle.kts, build.gradle.kts, and the app/ directory."
            echo ""
            echo "👉 TO RESOLVE:"
            echo "1. In Google AI Studio, click Settings > Download ZIP (or push the repository)."
            echo "2. Ensure the unzipped project files are committed to the root of your GitHub repository:"
            echo "     settings.gradle.kts"
            echo "     build.gradle.kts"
            echo "     gradle.properties"
            echo "     app/"
            echo "     gradle/"
            echo "3. Push the commit to GitHub and re-run this workflow."
            echo ""
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Create .env Configuration
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Build Android APK
        working-directory: ${{ steps.locate-project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          APK_PATH=$(find . -name "*.apk" -not -path "*/release_assets/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release_assets/Vyntra.apk
            echo "APK successfully prepared at release_assets/Vyntra.apk ($(du -h release_assets/Vyntra.apk | cut -f1))"
          else
            echo "::error::Build completed but no APK was found!"
            exit 1
          fi

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_name }}"
            PUB_REL="${{ github.event.inputs.publish_release }}"
            PUB_PKG="${{ github.event.inputs.publish_package }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUB_REL="true"
            PUB_PKG="true"
          else
            TAG="v1.0.0-${GITHUB_SHA::7}"
            PUB_REL="true"
            PUB_PKG="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "publish_release=$PUB_REL" >> $GITHUB_OUTPUT
          echo "publish_package=$PUB_PKG" >> $GITHUB_OUTPUT

      # 1. Download via GitHub Actions Artifacts
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vyntra-APK
          path: release_assets/Vyntra.apk
          retention-days: 30
          if-no-files-found: error

      # 2. Download via GitHub Releases
      - name: Publish to GitHub Releases
        if: steps.vars.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Vyntra ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/Vyntra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Download via GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry (GitHub Packages)
        if: steps.vars.outputs.publish_package == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Package to GitHub Packages
        if: steps.vars.outputs.publish_package == 'true'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/vyntra-apk"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.vars.outputs.tag }}"

          cat << 'EOF' > Dockerfile.package
          FROM alpine:latest
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Vyntra Android APK Distribution Package"
          LABEL org.opencontainers.image.licenses="Apache-2.0"
          WORKDIR /dist
          COPY release_assets/Vyntra.apk /dist/Vyntra.apk
          CMD ["sh", "-c", "echo 'Vyntra APK available in /dist/Vyntra.apk'"]
          EOF

          docker build -f Dockerfile.package -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:latest"
          echo "Successfully published to GitHub Packages: $IMAGE_NAME:$TAG"
