name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set!"
            exit 1
          fi

          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected active Java major version: $JAVA_MAJOR_VERSION"

          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "::error::Could not detect Java major version!"
            exit 1
          fi

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version is $JAVA_MAJOR_VERSION, which is lower than 17!"
            exit 1
          fi
          echo "Java 17 or newer verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing temporary keystore."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Create .env Configuration
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY" > .env
          fi
          echo ".env configuration prepared."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify-apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK at $EXPECTED_APK not found. Searching app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "::error::Expected debug APK $EXPECTED_APK does not exist!"
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file!"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty!"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have .apk extension!"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK is not app/build/outputs/apk/debug/app-debug.apk!"
            exit 1
          fi

          echo "Verified APK: $EXPECTED_APK ($(du -h "$EXPECTED_APK" | cut -f1))"
          echo "apk_path=$EXPECTED_APK" >> $GITHUB_OUTPUT

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep-asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW#*/}"
          SANITIZED_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Prepared release asset $DEST_PATH is missing or empty!"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$RELEASE_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: release-step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version

          ASSET_PATH="${{ steps.prep-asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Asset file $ASSET_PATH not found!"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Asset file $ASSET_PATH is empty!"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Asset file $ASSET_PATH is not an .apk file!"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ## Vyntra Debug APK Build

          - **Notice:** This is an automatically generated debug APK.
          - **Builder:** The APK was built by GitHub Actions.
          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Purpose:** The APK is intended for testing.
          - **Production Warning:** The APK is not a Play Store production release.
          - **Signing:** The APK is signed only with a temporary debug keystore.
          EOF

          echo "Publishing release with tag $RELEASE_TAG and asset $ASSET_PATH..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prep-asset.outputs.asset_filename }}"

          if [ "${{ steps.release-step.outcome }}" = "success" ]; then
            echo "=== Release Published Successfully ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat << EOF >> $GITHUB_STEP_SUMMARY
            # 🚀 Debug APK Build & Release Succeeded!

            - **Release Tag:** \`$RELEASE_TAG\`
            - **Release Title:** $RELEASE_TITLE
            - **Download Direct from Release:** [$RELEASE_URL]($RELEASE_URL)
            - **APK Asset:** \`$ASSET_NAME\`

            The APK can be downloaded directly from the release **Assets** section on your phone.
            The normal GitHub Actions workflow artifact (\`app-debug-apk\`) is also available as a backup.
          EOF
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the APK was successfully built and uploaded to Actions artifacts."
            echo "Actions artifact 'app-debug-apk' remains fully available."

            cat << EOF >> $GITHUB_STEP_SUMMARY
            # ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

            - **Status:** The APK build succeeded.
            - **Workflow Artifact:** The Actions artifact named \`app-debug-apk\` remains available.
            - **Note:** GitHub Release publishing did not complete, but your APK is securely archived in the Actions artifacts above.
          EOF
          fi
