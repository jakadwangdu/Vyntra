name: Build, Release & Publish Vyntra APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish to GitHub Releases'
        type: boolean
        required: false
        default: true
      publish_package:
        description: 'Publish to GitHub Packages (GHCR)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-publish:
    name: Build APK, Publish Release & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect & Ensure Gradle Build Environment
        id: prepare-gradle
        run: |
          echo "================ Inspecting Repository ================"
          ls -la
          echo "======================================================="

          mkdir -p gradle/wrapper

          # 1. Ensure gradle/libs.versions.toml
          if [ ! -f "gradle/libs.versions.toml" ]; then
            echo "Auto-creating gradle/libs.versions.toml..."
            cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "9.1.1"
          coreKtx = "1.18.0"
          junit = "4.13.2"
          junitVersion = "1.3.0"
          espressoCore = "3.7.0"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.10.1"
          kotlin = "2.2.10"
          composeBom = "2024.09.00"
          googleDevtoolsKsp = "2.3.5"
          navigationCompose = "2.8.9"
          roomRuntime = "2.7.0"
          roomKtx = "2.7.0"
          roomCompiler = "2.7.0"
          kotlinxCoroutinesTest = "1.10.2"
          core = "1.6.1"
          runner = "1.6.2"
          coilCompose = "2.7.0"
          retrofit = "2.12.0"
          converterMoshi = "2.12.0"
          kotlinxCoroutinesAndroid = "1.10.2"
          kotlinxCoroutinesCore = "1.10.2"
          accompanistPermissions = "0.37.3"
          playServicesLocation = "21.3.0"
          cameraCamera2 = "1.5.0"
          cameraLifecycle = "1.5.0"
          cameraView = "1.5.0"
          cameraCore = "1.5.0"
          loggingInterceptor = "4.10.0"
          okhttp = "4.10.0"
          moshiKotlin = "1.15.2"
          moshiKotlinCodegen = "1.15.2"
          datastorePreferences = "1.1.7"
          robolectric = "4.16.1"
          roborazzi = "1.59.0"
          firebaseBom = "34.17.0"
          secretsGradlePlugin = "2.0.1"
          googleServices = "4.5.0"
          credentials = "1.5.0"
          googleid = "1.1.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }
          play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
          androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraCamera2" }
          androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraLifecycle" }
          androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraView" }
          androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraCore" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
          roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
          roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
          roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
          firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
          firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
          firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-recaptcha" }
          firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
          firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
          firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
          androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
          androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
          googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
          roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          EOF
          fi

          # 2. Ensure settings.gradle.kts
          if [ ! -f "settings.gradle.kts" ]; then
            echo "Auto-creating settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google {
                content {
                  includeGroupByRegex("com\\.android.*")
                  includeGroupByRegex("com\\.google.*")
                  includeGroupByRegex("androidx.*")
                }
              }
              mavenCentral()
              gradlePluginPortal()
            }
          }

          plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "Vyntra"

          include(":app")
          EOF
          fi

          # 3. Ensure build.gradle.kts
          if [ ! -f "build.gradle.kts" ]; then
            echo "Auto-creating build.gradle.kts..."
            cat << 'EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.roborazzi) apply false
            alias(libs.plugins.secrets) apply false
            alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          # 4. Ensure gradle.properties
          if [ ! -f "gradle.properties" ]; then
            echo "Auto-creating gradle.properties..."
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          org.gradle.workers.max=4
          kotlin.compiler.execution.strategy=in-process
          googleServices.missing.passthrough=true
          EOF
          fi

          # 5. Ensure gradle-wrapper.properties
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Auto-creating gradle/wrapper/gradle-wrapper.properties..."
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          # 6. Ensure debug.keystore exists so signingConfig debugConfig succeeds
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 7. Ensure Android Resources required by AndroidManifest exist
          # Note: <adaptive-icon> is only valid in -v26 qualifiers. Never put adaptive-icon in unqualified res/mipmap!
          rm -rf app/src/main/res/mipmap
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            echo "Auto-creating app/src/main/res/values/themes.xml..."
            cat << 'EOF' > app/src/main/res/values/themes.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.MyApplication" parent="android:Theme.DeviceDefault.NoActionBar" />
</resources>
EOF
          fi

          if [ ! -f "app/src/main/res/values/colors.xml" ]; then
            echo "Auto-creating app/src/main/res/values/colors.xml..."
            cat << 'EOF' > app/src/main/res/values/colors.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="purple_200">#FFBB86FC</color>
    <color name="purple_500">#FF6200EE</color>
    <color name="purple_700">#FF3700B3</color>
    <color name="teal_200">#FF03DAC5</color>
    <color name="teal_700">#FF018786</color>
    <color name="black">#FF000000</color>
    <color name="white">#FFFFFFFF</color>
</resources>
EOF
          fi

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            echo "Auto-creating app/src/main/res/values/strings.xml..."
            cat << 'EOF' > app/src/main/res/values/strings.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">Vyntra</string>
    <string name="greeting_morning">Good morning</string>
    <string name="calories_left">Calories left</string>
    <string name="eaten">Eaten</string>
    <string name="burned">Burned</string>
    <string name="carbs">Carbs</string>
    <string name="protein">Protein</string>
    <string name="fats">Fats</string>
    <string name="water">Water</string>
    <string name="meals">Meals</string>
</resources>
EOF
          fi

          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            echo "Auto-creating app/src/main/res/xml/data_extraction_rules.xml..."
            cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
<?xml version="1.0" encoding="utf-8"?>
<data-extraction-rules>
    <cloud-backup />
</data-extraction-rules>
EOF
          fi

          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            echo "Auto-creating app/src/main/res/xml/backup_rules.xml..."
            cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
<?xml version="1.0" encoding="utf-8"?>
<full-backup-content />
EOF
          fi

          if [ ! -f "app/src/main/res/drawable/ic_launcher_background.xml" ]; then
            echo "Auto-creating app/src/main/res/drawable/ic_launcher_background.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#0E0F12"
        android:pathData="M0,0h108v108h-108z" />
</vector>
EOF
          fi

          if [ ! -f "app/src/main/res/drawable/ic_launcher_foreground.xml" ]; then
            echo "Auto-creating app/src/main/res/drawable/ic_launcher_foreground.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#F4F3EF"
        android:pathData="M66.29,34.45 L79.3,34.45 L71.78,43.62 L63.06,43.62 L50.73,55.5 Z" />
    <path
        android:fillColor="#F4F3EF"
        android:pathData="M28.7,34.45 L43.36,34.45 L50.73,55.5 L61.4,47.68 L68.14,47.68 L71.78,43.62 L77.57,43.62 L63.29,63.77 C59.53,69.79 56.52,73.55 53.14,73.55 C49.75,73.55 46.75,69.79 44.49,63.77 Z" />
</vector>
EOF
          fi

          if [ ! -f "app/src/main/res/drawable/ic_vyntra_logo.xml" ]; then
            echo "Auto-creating app/src/main/res/drawable/ic_vyntra_logo.xml..."
            cat << 'EOF' > app/src/main/res/drawable/ic_vyntra_logo.xml
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="120dp"
    android:height="120dp"
    android:viewportWidth="1000"
    android:viewportHeight="1000">
    <path
        android:fillColor="#0E0F12"
        android:pathData="M220,0 L780,0 C901.5,0 1000,98.5 1000,220 L1000,780 C1000,901.5 901.5,1000 780,1000 L220,1000 C98.5,1000 0,901.5 0,780 L0,220 C0,98.5 98.5,0 220,0 Z" />
    <path
        android:fillColor="#F4F3EF"
        android:pathData="M675,260 L848,260 L748,382 L632,382 L468,540 Z" />
    <path
        android:fillColor="#F4F3EF"
        android:pathData="M175,260 L370,260 L468,540 L610,436 L700,436 L748,382 L825,382 L635,650 C585,730 545,780 500,780 C455,780 415,730 385,650 Z" />
</vector>
EOF
          fi

          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo "Auto-creating app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml..."
            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
    <monochrome android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
EOF
          fi

          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
            echo "Auto-creating app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml..."
            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
    <monochrome android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
EOF
          fi

          # Create density-specific fallback icons for AAPT pre-API 26 linking
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$dpi"
            if [ ! -f "app/src/main/res/mipmap-$dpi/ic_launcher.png" ] && [ ! -f "app/src/main/res/mipmap-$dpi/ic_launcher.webp" ]; then
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > "app/src/main/res/mipmap-$dpi/ic_launcher.png"
            fi
            if [ ! -f "app/src/main/res/mipmap-$dpi/ic_launcher_round.png" ] && [ ! -f "app/src/main/res/mipmap-$dpi/ic_launcher_round.webp" ]; then
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > "app/src/main/res/mipmap-$dpi/ic_launcher_round.png"
            fi
          done

          if [ ! -f "app/src/main/res/drawable/ic_launcher.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#0E0F12" android:pathData="M0,0h108v108h-108z"/>
</vector>
EOF
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "Auto-creating fallback app/google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789012",
    "project_id": "vyntra-fitness",
    "storage_bucket": "vyntra-fitness.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
        "android_client_info": {
          "package_name": "com.example"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key_for_build"
        }
      ],
      "services": {}
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          if [ ! -f "app/proguard-rules.pro" ]; then
            touch app/proguard-rules.pro
          fi

          echo "All required Gradle and Android resource files are verified!"
          ls -la
          ls -la gradle/

      - name: Setup Gradle (v9.3.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env Configuration
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Build Android APK
        run: |
          # Generate wrapper if missing
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          APK_PATH=$(find . -name "*.apk" -not -path "*/release_assets/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release_assets/Vyntra.apk
            echo "APK successfully prepared at release_assets/Vyntra.apk ($(du -h release_assets/Vyntra.apk | cut -f1))"
          else
            echo "::error::Build completed but no APK was found in build outputs!"
            find . -maxdepth 4 -ls
            exit 1
          fi

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_name }}"
            PUB_REL="${{ github.event.inputs.publish_release }}"
            PUB_PKG="${{ github.event.inputs.publish_package }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUB_REL="true"
            PUB_PKG="true"
          else
            TAG="v1.0.0-${GITHUB_SHA::7}"
            PUB_REL="true"
            PUB_PKG="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "publish_release=$PUB_REL" >> $GITHUB_OUTPUT
          echo "publish_package=$PUB_PKG" >> $GITHUB_OUTPUT

      # 1. Download via GitHub Actions Artifacts
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vyntra-APK
          path: release_assets/Vyntra.apk
          retention-days: 30
          if-no-files-found: error

      # 2. Download via GitHub Releases
      - name: Publish to GitHub Releases
        if: steps.vars.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Vyntra ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/Vyntra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Download via GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry (GitHub Packages)
        if: steps.vars.outputs.publish_package == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Package to GitHub Packages
        if: steps.vars.outputs.publish_package == 'true'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/vyntra-apk"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.vars.outputs.tag }}"

          cat << 'EOF' > Dockerfile.package
          FROM alpine:latest
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="Vyntra Android APK Distribution Package"
          LABEL org.opencontainers.image.licenses="Apache-2.0"
          WORKDIR /dist
          COPY release_assets/Vyntra.apk /dist/Vyntra.apk
          CMD ["sh", "-c", "echo 'Vyntra APK available in /dist/Vyntra.apk'"]
          EOF

          docker build -f Dockerfile.package -t "$IMAGE_NAME:$TAG" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:latest"
          echo "Successfully published to GitHub Packages: $IMAGE_NAME:$TAG"
